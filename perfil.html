<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOCK IN</title>

    <script src="assets/js/theme.js"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Righteous&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/perfil.style.css" />
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/logo.ico" />
  </head>
  <body>
    <!-- Barra lateral -->
    <div class="app-layout">
      <button
        class="sidebar-toggle"
        id="sidebarToggle"
        aria-label="Abrir menu"
        aria-expanded="false"
      >
        <i class="bi bi-list"></i>
      </button>

      <aside class="sidebar" id="sidebar">
        <button
          type="button"
          class="sidebar-close"
          id="sidebarClose"
          aria-label="Cerrar menú"
        >
          <i class="bi bi-x-lg"></i>
        </button>
        <div class="sidebar-logo">
          <h1>LOCK IN</h1>
        </div>

        <nav class="sidebar-nav">
          <a href="perfil.html" class="nav-item active">
            <i class="bi bi-person-circle" aria-hidden="true"></i>
            <span>Perfil</span>
          </a>
          <a href="index.html" class="nav-item">
            <i class="bi bi-journal-bookmark-fill" aria-hidden="true"></i>
            <span>Estudio</span>
          </a>
          <button
            type="button"
            class="nav-personalizar"
            id="abrirPersonalizacion"
          >
            <i class="bi bi-palette"></i> Personalizar
          </button>
          <a href="login.html" class="nav-item nav-item-exit">
            <i class="bi bi-box-arrow-left" aria-hidden="true"></i>
            <span>Salir</span>
          </a>
        </nav>
      </aside>

      <!-- Contenido principal -->
      <main class="content">
        <aside id="pomodoroPerfil" class="pomodoro-profile" hidden>
          <div>
            <strong>Sesión de estudio</strong>
            <span id="estadoPomodoroPerfil"></span>
          </div>
          <strong id="tiempoPomodoroPerfil">00:00:00</strong>
          <button type="button" id="controlPomodoroPerfil">Pausar</button>
        </aside>

        <div class="cards-grid">
          <!-- Perfil -->
          <section id="perfil" class="card">
            <header class="dashboard-header">
              <div class="dashboard-greeting">
                <h2 id="saludo">Buen día</h2>
                <p id="fecha-actual"></p>
              </div>
            </header>

            <div class="profile-main">
              <div id="foto">
                <div id="fotoWrapper">
                  <label for="inputFoto" id="botonCambiarFoto" aria-label="Cambiar foto de perfil">
                    <div id="sinFotoPerfil" aria-hidden="true">Sin foto</div>
                    <img id="fotoPerfil" alt="Foto de perfil" hidden />
                  </label>
                  <input
                    type="file"
                    id="inputFoto"
                    accept="image/*,.gif"
                    hidden
                  />
                </div>
              </div>

              <div class="desc">
                <!-- ===== MODO VER ===== -->
                <div id="verPerfil">
                  <h3 id="verNombre">Nombre Completo</h3>
                  <p id="verUsername">
                    <span id="verUsuario">usuario</span> ·
                    <span id="verPronombres">pronombres</span>
                  </p>
                  <p id="verBio">Acá va tu biografía</p>
                  <p><strong>Institución:</strong> <span id="verInstitucion">Sin indicar</span></p>
                  <p><strong>Cuatrimestre:</strong> <span id="verCuatrimestre">Sin indicar</span></p>
                  <button id="botonEditar">Editar perfil</button>
                </div>

                <!-- ===== MODO EDITAR (debe arrancar con 'hidden') ===== -->
                <div id="editarPerfil" hidden>
                  <label for="inputUser">usuario</label>
                  <input type="text" id="inputUser" />

                  <label for="inputNombre">Nombre</label>
                  <input type="text" id="inputNombre" />

                  <label for="inputPronombres">Pronombres</label>
                  <input
                    type="text"
                    id="inputPronombres"
                    placeholder="ej: él/ella"
                  />

                  <label for="inputBio">Bio</label>
                  <textarea id="inputBio"></textarea>

                  <label for="inputInstitucion">Institución</label>
                  <input type="text" id="inputInstitucion" />

                  <label for="inputCuatrimestre">Cuatrimestre</label>
                  <input
                    type="number"
                    id="inputCuatrimestre"
                    min="1"
                    step="1"
                    placeholder="Ej.: 2"
                  />

                  <div id="botonesEdicion">
                    <button id="botonGuardar">Guardar</button>
                    <button id="botonCancelar" type="button">Cancelar</button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="materias" class="card materias-card">
            <h3>Mis materias</h3>
            <form id="formMateria" class="materia-form">
              <label for="nombreMateria">Nombre de la materia</label>
              <div class="materia-input-row">
                <input
                  type="text"
                  id="nombreMateria"
                  maxlength="80"
                  required
                  placeholder="Ej.: Matemática"
                />
                <button type="submit" id="guardarMateria">Agregar materia</button>
                <button type="button" id="cancelarEdicionMateria" hidden>
                  Cancelar
                </button>
              </div>
              <p id="errorMateria" class="materia-error" role="alert"></p>
            </form>
            <div id="listaMaterias" class="materias-list"></div>
          </section>
        </div>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Libreria para el confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Panel de personalización -->
    <div id="personalizacionOverlay" class="personalizacion-overlay">
      <div class="personalizacion-modal">
        <button
          type="button"
          id="cerrarPersonalizacion"
          class="cerrar-modal"
          aria-label="Cerrar"
        >
          <i class="bi bi-x-lg"></i>
        </button>
        <h3>Personalizar apariencia</h3>

        <div class="personalizacion-bloque">
          <label>Modo</label>
          <div class="modo-toggle" id="modoToggle"></div>
        </div>

        <div class="personalizacion-bloque">
          <label>Color de tema</label>
          <div class="paletas-grid" id="paletasGrid"></div>
        </div>

        <div class="personalizacion-bloque">
          <label>Fondo</label>
          <div class="personalizacion-fondo-row">
            <div id="fondoPreview" class="fondo-preview"></div>
            <input type="color" id="inputColorFondo" title="Color de fondo" />
            <input type="file" id="inputFondo" accept="image/*" />
          </div>
          <button
            type="button"
            id="quitarFondo"
            class="btn-clear"
            style="margin-top: 8px"
          >
            Quitar imagen/color
          </button>
        </div>

        <div class="personalizacion-bloque">
          <span
            >Transparencia de los paneles:
            <span id="opacidadValor">100%</span></span
          >
          <input
            type="range"
            id="opacidadSlider"
            min="0.3"
            max="1"
            step="0.05"
            value="1"
          />
        </div>

        <div class="personalizacion-bloque">
          <span
            >Desenfoque de la imagen de fondo:
            <span id="desenfoqueValor">0px</span></span
          >
          <input
            type="range"
            id="desenfoqueSlider"
            min="0"
            max="20"
            step="1"
            value="0"
          />
        </div>

        <div class="personalizacion-botones">
          <button
            type="button"
            id="restablecerPersonalizacion"
            class="btn-restablecer"
          >
            Restablecer
          </button>
          <button type="button" id="cancelarPersonalizacion" class="btn-clear">
            Cancelar
          </button>
          <button type="button" id="guardarPersonalizacion">
            Guardar cambios
          </button>
        </div>
      </div>
    </div>

    <script src="assets/js/personalizacion.js"></script>
    <script src="assets/js/study-data.js"></script>
    <script src="assets/js/perfil.js"></script>
  </body>
</html>
