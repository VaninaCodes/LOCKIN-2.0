<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOCK IN</title>

    <!-- Script Anti-Flash: Aplica tema inmediatamente antes de pintar el DOM -->
    <script>
      (function () {
        try {
          const guardado = localStorage.getItem("lockin_personalizacion");
          if (guardado) {
            const config = JSON.parse(guardado);
            const paletas = [
              {
                id: "predeterminado",
                accent: "#353A3E",
                accentDark: "#1A1A1A",
                tint: "#E0E0E0",
                bg: "#C8C8C8",
                text: "#222526",
              },
              {
                id: "rosa",
                accent: "#DB8291",
                accentDark: "#720002",
                tint: "#F4D6DC",
                bg: "#F4D6DC",
                text: "#720002",
              },
              {
                id: "marron",
                accent: "#684F36",
                accentDark: "#342519",
                tint: "#EDE6D9",
                bg: "#EDE6D9",
                text: "#342519",
              },
              {
                id: "verde",
                accent: "#47622A",
                accentDark: "#354220",
                tint: "#DFE7D1",
                bg: "#DFE7D1",
                text: "#354220",
              },
              {
                id: "azul",
                accent: "#3B587D",
                accentDark: "#16294A",
                tint: "#F5F4F0",
                bg: "#E8EFF8",
                text: "#16294A",
              },
            ];
            const paleta =
              paletas.find((p) => p.id === config.paletaId) || paletas[0];
            const raiz = document.documentElement.style;
            const modo = config.modo || "claro";
            document.documentElement.setAttribute("data-modo", modo);

            if (modo === "oscuro") {
              raiz.removeProperty("--bg-base");
              raiz.removeProperty("--text-base");
            } else {
              raiz.setProperty("--bg-base", config.colorFondo || paleta.bg);
              raiz.setProperty("--text-base", paleta.text);
            }

            raiz.setProperty("--accent-color", paleta.accent);
            raiz.setProperty("--accent-dark", paleta.accentDark);
            raiz.setProperty("--accent-tint", paleta.tint);
            raiz.setProperty(
              "--panel-opacity",
              config.opacidad !== undefined ? config.opacidad : 1,
            );
            raiz.setProperty("--bg-blur", (config.desenfoque || 0) + "px");
            if (config.colorFondo)
              raiz.setProperty("--bg-color-custom", config.colorFondo);
            if (config.fondo)
              raiz.setProperty("--bg-image", "url(" + config.fondo + ")");
          }
        } catch (e) {}
      })();
    </script>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/perfil.style.css" />
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/logo.ico" />
  </head>
  <body>
    <!-- Barra lateral -->
    <div class="app-layout">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
      </button>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <h1>LOCK IN</h1>
        </div>

        <nav class="sidebar-nav">
          <a href="perfil.html" class="nav-item active"> Perfil </a>
          <a href="index.html" class="nav-item"> Estudio </a>
          <button
            type="button"
            class="nav-personalizar"
            id="abrirPersonalizacion"
          >
            <i class="bi bi-palette"></i> Personalizar
          </button>
          <a href="login.html" class="nav-item"> Salir </a>
        </nav>
      </aside>

      <!-- Contenido principal -->
      <main class="content">
        <header>
          <h2>Hola usuario</h2>
        </header>

        <div class="cards-grid">
          <!-- Perfil -->
          <section id="perfil" class="card">
            <div id="foto">
              <div id="fotoWrapper">
                <img
                  id="fotoPerfil"
                  src="https://i.pinimg.com/1200x/b7/d2/98/b7d29834b980613edcb4429a245ceb38.jpg"
                  alt="fotoPerfilUsuario"
                />
                <label for="inputFoto" id="botonCambiarFoto">
                  <i class="bi bi-pencil-fill"></i>
                  <span class="tooltip-foto">Cambiar foto</span>
                </label>
                <input type="file" id="inputFoto" accept="image/*" hidden />
              </div>
            </div>

            <div class="desc">
              <!-- ===== MODO VER ===== -->
              <div id="verPerfil">
                <h3 id="verNombre">Nombre Completo</h3>
                <p id="verUsername">
                  <span id="verUsuario">usuario</span> ·
                  <span id="verPronombres">pronombres</span>
                </p>
                <p id="verBio">Acá va tu biografía</p>
                <button id="botonEditar">Editar perfil</button>
              </div>

              <!-- ===== MODO EDITAR (debe arrancar con 'hidden') ===== -->
              <div id="editarPerfil" hidden>
                <label for="inputUser">usuario</label>
                <input type="text" id="inputUser" />

                <label for="inputNombre">Nombre</label>
                <input type="text" id="inputNombre" />

                <label for="inputPronombres">Pronombres</label>
                <input
                  type="text"
                  id="inputPronombres"
                  placeholder="ej: él/ella"
                />

                <label for="inputBio">Bio</label>
                <textarea id="inputBio"></textarea>

                <div id="botonesEdicion">
                  <button id="botonGuardar">Guardar</button>
                  <button id="botonCancelar" type="button">Cancelar</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Libreria para el confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Panel de personalización -->
    <div id="personalizacionOverlay" class="personalizacion-overlay">
      <div class="personalizacion-modal">
        <button
          type="button"
          id="cerrarPersonalizacion"
          class="cerrar-modal"
          aria-label="Cerrar"
        >
          <i class="bi bi-x-lg"></i>
        </button>
        <h3>Personalizar apariencia</h3>

        <div class="personalizacion-bloque">
          <label>Modo</label>
          <div class="modo-toggle" id="modoToggle"></div>
        </div>

        <div class="personalizacion-bloque">
          <label>Color de tema</label>
          <div class="paletas-grid" id="paletasGrid"></div>
        </div>

        <div class="personalizacion-bloque">
          <label>Fondo</label>
          <div class="personalizacion-fondo-row">
            <div id="fondoPreview" class="fondo-preview"></div>
            <input type="color" id="inputColorFondo" title="Color de fondo" />
            <input type="file" id="inputFondo" accept="image/*" />
          </div>
          <button
            type="button"
            id="quitarFondo"
            class="btn-clear"
            style="margin-top: 8px"
          >
            Quitar imagen/color
          </button>
        </div>

        <div class="personalizacion-bloque">
          <span
            >Transparencia de los paneles:
            <span id="opacidadValor">100%</span></span
          >
          <input
            type="range"
            id="opacidadSlider"
            min="0.3"
            max="1"
            step="0.05"
            value="1"
          />
        </div>

        <div class="personalizacion-bloque">
          <span
            >Desenfoque de la imagen de fondo:
            <span id="desenfoqueValor">0px</span></span
          >
          <input
            type="range"
            id="desenfoqueSlider"
            min="0"
            max="20"
            step="1"
            value="0"
          />
        </div>

        <div class="personalizacion-botones">
          <button
            type="button"
            id="restablecerPersonalizacion"
            class="btn-restablecer"
          >
            Restablecer
          </button>
          <button type="button" id="cancelarPersonalizacion" class="btn-clear">
            Cancelar
          </button>
          <button type="button" id="guardarPersonalizacion">
            Guardar cambios
          </button>
        </div>
      </div>
    </div>

    <script src="assets/js/personalizacion.js"></script>
    <script src="assets/js/perfil.js"></script>
  </body>
</html>
